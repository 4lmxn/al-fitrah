name: Daily follow-up digest

# Pings the CRM's follow-up endpoint once a day so leads whose follow-up is due
# or overdue get emailed as a digest. Free alternative to Cloud Scheduler.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   Secret   CRON_SECRET  — must match the CRON_SECRET set in Firebase App Hosting
#   Variable APP_URL      — site origin, no trailing slash
#                           e.g. https://www.alfitrahsarjapura.in

on:
  schedule:
    # 03:30 UTC = 09:00 IST daily. GitHub may delay scheduled runs under load;
    # fine for a once-a-day digest.
    - cron: "30 3 * * *"
  workflow_dispatch: {} # allows a manual run from the Actions tab to test

# Never run two digests at once if a run overlaps.
concurrency:
  group: followup-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger follow-up digest
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL variable and CRON_SECRET secret in repo settings."
            exit 1
          fi
          url="${APP_URL%/}/api/cron/followups"
          echo "Calling $url"
          # -sS quiet but show errors; capture body + HTTP status separately.
          body=$(curl -sS -m 60 -o /tmp/resp.txt -w "%{http_code}" \
            -H "x-cron-secret: ${CRON_SECRET}" "$url") || {
            echo "::error::Request failed to reach the endpoint."; exit 1; }
          echo "HTTP $body"
          cat /tmp/resp.txt
          if [ "$body" != "200" ]; then
            echo "::error::Endpoint returned $body (expected 200). Check CRON_SECRET matches App Hosting."
            exit 1
          fi
