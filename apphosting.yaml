# Firebase App Hosting config for the Al Fitrah Next.js app.
# Server-side Firestore writes use Application Default Credentials automatically.
runConfig:
  # Keep one instance warm. Measured cold start on this app was 2.7s TTFB on a
  # server-rendered admin page against 0.18s warm — the entire perceived
  # slowness of the system, paid every time the instance had scaled to zero
  # (first visitor of the morning, every time).
  #
  # 💰 This is what ends the ₹0 free tier: an always-on instance bills around
  # the clock, roughly ₹900-1,500/month. Set back to 0 to return to ₹0/month
  # and 2.7s cold starts. That trade is the whole Firebase-vs-AWS question in
  # one line — see docs/deploy-cloudrun-cloudflare.md.
  minInstances: 1

  # Safe to raise now: rate-limit counters moved to Firestore, so limits are
  # per-deployment rather than per-instance. (They were in-process memory,
  # which silently made every limit N times looser at N instances — the reason
  # this used to be pinned at 1.)
  maxInstances: 2

env:
  # The server's clock is the school's clock. "Today" is decided with
  # setHours(0,0,0,0) throughout — attendance date keys, follow-up dates, fee
  # buckets — which reads the process timezone. Left at UTC, the day rolls over
  # at 05:30 IST: a fee due today reads overdue, and the register opens on
  # yesterday, for the first five and a half hours of every morning.
  - variable: TZ
    value: "Asia/Kolkata"
    availability: [RUNTIME]

  # Canonical origin for metadataBase, canonicals, sitemap.xml and JSON-LD.
  # Set to the GoDaddy custom domain (www form, matching what was purchased).
  # Only takes effect once the domain is connected + verified in Firebase App
  # Hosting; until then the site is also reachable on its .hosted.app URL.
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://www.alfitrahsarjapura.in"
    availability: [BUILD, RUNTIME]

  # Shared secret Cloudflare attaches to every request it forwards, so the app
  # can tell edge traffic from someone hitting the origin directly and decide
  # whether CF-Connecting-IP is worth believing.
  #
  # Replaces a TRUST_CLOUDFLARE_IP boolean that was wrong in both positions:
  # "1" let anyone reaching the origin spoof their address and walk past every
  # rate limit; "0" collapsed every visitor behind Cloudflare onto the edge's
  # address, so one person tripping a limit locked out the school. The flag was
  # only safe behind a network-level origin lock, which on Cloud Run means a
  # load balancer costing several times this project's hosting budget.
  #
  # Safe while unset — nothing trusts the header until Cloudflare is actually
  # in front and configured to send the token. See src/lib/clientIp.ts.
  - variable: EDGE_TOKEN
    secret: EDGE_TOKEN
    availability: [RUNTIME]

  # Coming-soon holding page. "1" rewrites every public route to /coming-soon
  # (admin + API stay open). Set to "0" and redeploy to reveal the full site.
  - variable: NEXT_PUBLIC_COMING_SOON
    value: "0"
    availability: [BUILD, RUNTIME]

  # Google Analytics 4 + Search Console. Inert until real values are pasted in
  # (the code omits the tag/script entirely when unset), so they ship empty.
  # - variable: NEXT_PUBLIC_GA_ID
  #   value: "G-XXXXXXXXXX"
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
  #   value: "<token from Search Console HTML-tag method>"
  #   availability: [BUILD, RUNTIME]

  # Exact campus pin for the LocalBusiness geo block (strongest Maps signal).
  # - variable: NEXT_PUBLIC_GEO_LAT
  #   value: "12.8xxxx"
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_GEO_LNG
  #   value: "77.7xxxx"
  #   availability: [BUILD, RUNTIME]

  # Public Firebase web config (safe to expose; shipped in the client bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBnNP4ftDUQxKVXeSUbZeuU2IyIh-7FcBo"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "al-fitrah.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "al-fitrah"
    availability: [BUILD, RUNTIME]
  # Private file store: CVs today, students' documents next.
  #
  # Moved off the Firebase default bucket, which resolves to us-east1 — South
  # Carolina. These are an applicant's CV and, shortly, a child's records; under
  # DPDP "where does this file physically live" has a wrong answer and that was
  # it. This bucket is asia-south1, alongside Firestore, with uniform access and
  # public access prevention enforced.
  #
  # Everything reaching it is streamed through an authenticated route, so it
  # needs no public read path — see src/lib/storage.ts. Public post images are a
  # separate problem with a separate answer; publicImagesSupported() refuses
  # them here rather than writing a URL that 404s.
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "al-fitrah-files"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "360754505866"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:360754505866:web:4f92c20b33819558d1e573"
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: "al-fitrah"
    availability: [RUNTIME]

  # Admin allowlist for the leads inbox (comma-separated emails). Secret —
  # create with: firebase apphosting:secrets:set ADMIN_EMAILS
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability: [RUNTIME]

  # Subset of ADMIN_EMAILS allowed to delete things. Everyone else is "staff":
  # full access to leads and the pipeline, no destructive actions.
  #
  # Now set. While unset, roleFor() returned "owner" for every allowed address —
  # a deliberate default so introducing roles could not lock the school out of
  # its own console, but one that quietly disabled the split it was added for.
  #
  # It matters from the next person onward, not today: there is currently one
  # admin. Adding the office staff to ADMIN_EMAILS would, under the old default,
  # have made them owners able to delete job openings and read every applicant's
  # CV. They now land as "staff" unless deliberately listed here.
  - variable: ADMIN_OWNERS
    secret: ADMIN_OWNERS
    availability: [RUNTIME]

  # Resend — transactional email for inquiry + application notifications.
  # REQUIRED before deploy: create the secret with the API key, or the deploy
  # fails on the missing secret reference:
  #   firebase apphosting:secrets:set RESEND_API_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [RUNTIME]
  # onboarding@resend.dev works immediately without domain verification, but in
  # Resend test mode it only delivers to the address that owns the Resend
  # account. To send to the school inbox below, either sign up to Resend with
  # alfitrah.sompura@gmail.com, or verify a sending domain and swap this from.
  - variable: INQUIRY_FROM_EMAIL
    value: "onboarding@resend.dev"
    availability: [RUNTIME]
  - variable: INQUIRY_ADMIN_EMAIL
    value: "alfitrah.sompura@gmail.com"
    availability: [RUNTIME]

  # Shared secret for the daily follow-up cron (/api/cron/followups). Create it,
  # then point a Cloud Scheduler job (daily) at the endpoint with header
  # "x-cron-secret: <this value>":
  #   firebase apphosting:secrets:set CRON_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]
